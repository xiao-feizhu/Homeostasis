<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent System - Yumi Live2D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: 100vh;
      gap: 20px;
      padding: 20px;
    }
    .canvas-area {
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #live2d-canvas { width: 100%; height: 100%; }
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      padding: 40px;
      text-align: center;
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }
    .panel {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
    }
    .panel h3 {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .expression-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .expr-btn {
      padding: 10px 8px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 12px;
    }
    .expr-btn:hover, .expr-btn.active { background: #4a9eff; }
    .status-pill {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .error-box {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.5);
      padding: 20px;
      border-radius: 10px;
      font-size: 13px;
      max-width: 500px;
    }
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-area">
      <canvas id="live2d-canvas"></canvas>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">初始化中...</span>
      </div>
      <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p>正在加载 Live2D...</p>
        <p style="font-size: 12px; opacity: 0.6;">使用 esm.sh (PixiJS 6.x)</p>
      </div>
    </div>

    <div class="controls-panel">
      <div class="panel">
        <h3>🎭 表情控制</h3>
        <div class="expression-grid">
          <button class="expr-btn" data-expr="爱心眼">❤️ 爱心</button>
          <button class="expr-btn" data-expr="黑脸">⬛ 黑脸</button>
          <button class="expr-btn" data-expr="泪汪汪">🥺 泪汪汪</button>
          <button class="expr-btn" data-expr="猫猫嘴">😺 猫猫</button>
          <button class="expr-btn" data-expr="拿话筒">🎤 话筒</button>
          <button class="expr-btn" data-expr="星星眼">✨ 星星</button>
        </div>
      </div>

      <div class="panel">
        <h3>ℹ️ 关于</h3>
        <div style="font-size: 12px; line-height: 1.6; opacity: 0.8;">
          <p>基于 airi 项目架构</p>
          <p>PixiJS 6.5.10 + pixi-live2d-display 0.4.0</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const statusText = document.getElementById('status-text');
    const loading = document.getElementById('loading');

    try {
      // 使用 esm.sh bundle 加载 PixiJS 6.x (与 airi 相同版本)
      const PIXI = await import('https://esm.sh/pixi.js@6.5.10?bundle');
      console.log('✅ PixiJS 加载成功:', PIXI.VERSION);

      // 加载 pixi-live2d-display 0.4.0 (与 airi 相同版本)
      const live2dModule = await import('https://esm.sh/pixi-live2d-display@0.4.0/cubism4?bundle&external=pixi.js');
      console.log('✅ Live2D 加载成功:', live2dModule);

      const { Live2DModel } = live2dModule;

      if (!Live2DModel) {
        throw new Error('Live2DModel 未导出');
      }

      const canvas = document.getElementById('live2d-canvas');

      // 创建 PixiJS 应用
      const app = new PIXI.Application({
        view: canvas,
        resizeTo: canvas.parentElement,
        backgroundAlpha: 0,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
      });

      console.log('✅ PixiJS 应用创建成功');

      // 加载模型 (使用 autoUpdate: false 手动控制更新)
      const model = await Live2DModel.from('yumi/yumi.model3.json', {
        autoUpdate: false
      });

      console.log('✅ 模型加载成功');

      app.stage.addChild(model);

      // 居中显示
      model.anchor.set(0.5, 0.5);
      model.x = app.screen.width / 2;
      model.y = app.screen.height / 2;

      const scale = Math.min(
        app.screen.width / model.width,
        app.screen.height / model.height
      ) * 0.7;
      model.scale.set(scale);

      // 手动更新循环
      function update() {
        model.update(app.ticker.deltaMS);
        app.ticker.update();
        requestAnimationFrame(update);
      }
      requestAnimationFrame(update);
      console.log('✅ 更新循环已启动');

      // 鼠标跟踪
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width * 2 - 1;
        const y = (e.clientY - rect.top) / rect.height * 2 - 1;
        model.focus(x, -y);
      });

      // 表情按钮
      document.querySelectorAll('.expr-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const expr = btn.dataset.expr;
          try {
            model.expression(expr);
            statusText.textContent = '表情: ' + expr;
            document.querySelectorAll('.expr-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          } catch (e) {
            console.error('表情切换失败:', e);
          }
        });
      });

      // 完成
      loading.classList.add('hidden');
      statusText.textContent = 'Yumi 已就绪';

    } catch (error) {
      console.error('加载失败:', error);
      loading.innerHTML = `
        <div class="error-box">
          <p><strong>❌ 加载失败</strong></p>
          <p style="margin-top: 8px;">${error.message}</p>
          <p style="margin-top: 12px; font-size: 11px; opacity: 0.8;">
            错误详情请查看控制台 (F12)
          </p>
        </div>
        <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; border: none; border-radius: 8px; background: #4a9eff; color: white; cursor: pointer;">
          重新加载
        </button>
      `;
      statusText.textContent = '加载失败';
    }
  </script>
</body>
</html>
