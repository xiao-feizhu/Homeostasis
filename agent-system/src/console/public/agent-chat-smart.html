<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent System - 智能聊天控制</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #252542;
      --accent-primary: #3b82f6;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255,255,255,0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
    }

    .header {
      height: 60px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 420px 360px;
      height: calc(100vh - 60px);
      margin-top: 60px;
    }

    /* Avatar Section */
    .avatar-section {
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .avatar-header {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }

    .avatar-info {
      padding: 10px 16px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      border-radius: 12px;
    }

    .avatar-name { font-weight: 600; font-size: 14px; }
    .avatar-status { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    .avatar-controls {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 36px; height: 36px;
      border: none;
      border-radius: 8px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--accent-primary);
      color: white;
    }

    #live2d-canvas { flex: 1; width: 100%; }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0,0,0,0.8);
      z-index: 50;
    }

    .loading-overlay.hidden { display: none; }

    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Chat Section */
    .chat-section {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-title { font-size: 14px; font-weight: 600; }

    .smart-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .toggle-switch {
      width: 44px; height: 24px;
      background: var(--bg-tertiary);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-switch.active {
      background: var(--accent-primary);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 20px; height: 20px;
      background: white;
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: all 0.2s;
    }

    .toggle-switch.active::after {
      left: 22px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 95%;
      animation: messageIn 0.3s ease;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: var(--accent-primary);
    }

    .message-content {
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.user .message-content {
      background: var(--accent-primary);
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .emotion-tag {
      padding: 2px 8px;
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent-primary);
      border-radius: 4px;
      font-size: 10px;
    }

    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: var(--bg-tertiary);
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 14px;
      padding: 8px 12px;
      outline: none;
    }

    .chat-input::placeholder { color: var(--text-secondary); }

    .btn-send {
      width: 36px; height: 36px;
      border: none;
      border-radius: 8px;
      background: var(--accent-primary);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-send:hover { background: #60a5fa; }

    /* Control Panel */
    .control-section {
      background: var(--bg-secondary);
      overflow-y: auto;
    }

    .panel {
      border-bottom: 1px solid var(--border-color);
    }

    .panel-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .panel-content { padding: 0 20px 20px; }

    /* Expression Grid */
    .expression-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .expr-btn {
      padding: 12px 8px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .expr-btn:hover {
      border-color: var(--accent-primary);
      background: var(--bg-hover);
    }

    .expr-btn.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .expr-icon { font-size: 20px; }

    /* Trigger Words */
    .trigger-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .trigger-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      font-size: 12px;
    }

    .trigger-word {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trigger-badge {
      padding: 2px 8px;
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent-primary);
      border-radius: 4px;
      font-size: 10px;
    }

    .current-expr {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Quick Actions */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .action-btn {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
    }

    .action-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    /* Log Panel */
    .log-container {
      max-height: 150px;
      overflow-y: auto;
      background: var(--bg-tertiary);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.6;
    }

    .log-entry {
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .log-entry.detected {
      color: var(--accent-success);
    }

    .log-entry.triggered {
      color: var(--accent-primary);
    }

    @media (max-width: 1200px) {
      .main-container { grid-template-columns: 1fr 350px; }
      .control-section { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="logo">Agent System</div>
      <div style="padding: 6px 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 20px; font-size: 12px; color: var(--accent-success);">
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-success); margin-right: 6px; animation: pulse 2s infinite;"></span>
        系统运行中
      </div>
    </div>
  </header>

  <div class="main-container">
    <!-- Avatar Section -->
    <section class="avatar-section">
      <div class="avatar-header">
        <div class="avatar-info">
          <div class="avatar-name">Yumi</div>
          <div class="avatar-status" id="avatar-status">等待指令...</div>
        </div>
        <div class="avatar-controls">
          <button class="btn-icon" id="btn-debug" title="调试">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </button>
        </div>
      </div>
      <canvas id="live2d-canvas"></canvas>
      <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p>正在初始化 Live2D...</p>
      </div>
    </section>

    <!-- Chat Section -->
    <section class="chat-section">
      <div class="chat-header">
        <span class="chat-title">💬 智能对话</span>
        <div class="smart-toggle">
          <span>智能表情</span>
          <div class="toggle-switch active" id="smart-toggle"></div>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="message">
          <div class="message-avatar">🤖</div>
          <div class="message-content">
            你好！我是 Yumi，你的 AI 助手。
            <br><br>
            💡 <strong>试试对我说：</strong>
            <br>• "我好开心！" → 爱心眼 😍
            <br>• "有点难过..." → 泪汪汪 🥺
            <br>• "我要唱歌" → 拿话筒 🎤
            <br>• "你好可爱" → 星星眼 ✨
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="input-wrapper">
          <input type="text" class="chat-input" id="chat-input" placeholder="输入消息，我会根据内容自动切换表情...">
          <button class="btn-send" id="btn-send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Control Panel -->
    <section class="control-section">
      <!-- Expressions -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">🎭 表情控制</span>
        </div>
        <div class="panel-content">
          <div class="expression-grid">
            <button class="expr-btn" data-expr="爱心眼">
              <span class="expr-icon">❤️</span>
              <span>爱心</span>
            </button>
            <button class="expr-btn" data-expr="黑脸">
              <span class="expr-icon">⬛</span>
              <span>黑脸</span>
            </button>
            <button class="expr-btn" data-expr="泪汪汪">
              <span class="expr-icon">🥺</span>
              <span>泪汪汪</span>
            </button>
            <button class="expr-btn" data-expr="猫猫嘴">
              <span class="expr-icon">😺</span>
              <span>猫猫</span>
            </button>
            <button class="expr-btn" data-expr="拿话筒">
              <span class="expr-icon">🎤</span>
              <span>话筒</span>
            </button>
            <button class="expr-btn" data-expr="星星眼">
              <span class="expr-icon">✨</span>
              <span>星星</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Trigger Words -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">🔑 触发词映射</span>
        </div>
        <div class="panel-content">
          <div class="trigger-list">
            <div class="trigger-item">
              <div class="trigger-word">
                <span>开心/喜欢/爱</span>
                <span class="trigger-badge">爱心眼</span>
              </div>
              <span class="current-expr">❤️</span>
            </div>
            <div class="trigger-item">
              <div class="trigger-word">
                <span>难过/伤心/哭</span>
                <span class="trigger-badge">泪汪汪</span>
              </div>
              <span class="current-expr">🥺</span>
            </div>
            <div class="trigger-item">
              <div class="trigger-word">
                <span>唱歌/音乐/话筒</span>
                <span class="trigger-badge">拿话筒</span>
              </div>
              <span class="current-expr">🎤</span>
            </div>
            <div class="trigger-item">
              <div class="trigger-word">
                <span>可爱/漂亮/棒</span>
                <span class="trigger-badge">星星眼</span>
              </div>
              <span class="current-expr">✨</span>
            </div>
            <div class="trigger-item">
              <div class="trigger-word">
                <span>生气/讨厌/黑脸</span>
                <span class="trigger-badge">黑脸</span>
              </div>
              <span class="current-expr">⬛</span>
            </div>
            <div class="trigger-item">
              <div class="trigger-word">
                <span>猫/喵/调皮</span>
                <span class="trigger-badge">猫猫嘴</span>
              </div>
              <span class="current-expr">😺</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Detection Log -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">📋 检测日志</span>
        </div>
        <div class="panel-content">
          <div class="log-container" id="log-container">
            <div class="log-entry">系统已启动，等待输入...</div>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">⚡ 快捷操作</span>
        </div>
        <div class="panel-content">
          <div class="quick-actions">
            <button class="action-btn" id="btn-reset">↩️ 重置表情</button>
            <button class="action-btn" id="btn-random">🎲 随机表情</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

  <script type="module">
    // 情感映射配置
    const emotionMap = {
      '爱心眼': {
        keywords: ['开心', '喜欢', '爱', '高兴', '快乐', '棒', '赞', '好', '爱你', '谢谢', '感谢'],
        response: '哇，我好开心！❤️'
      },
      '泪汪汪': {
        keywords: ['难过', '伤心', '哭', '委屈', '不舒服', '疼', '痛', '悲伤', '失望'],
        response: '不要难过啦... 🥺'
      },
      '拿话筒': {
        keywords: ['唱歌', '歌', '音乐', '话筒', '唱', '听', '声音', '说话', '讲'],
        response: '要听我唱歌吗？🎤'
      },
      '星星眼': {
        keywords: ['可爱', '漂亮', '美', '好看', '帅', '萌', '惊艳', '优秀', '厉害', '哇', '哇哦'],
        response: '真的吗？谢谢！✨'
      },
      '黑脸': {
        keywords: ['生气', '讨厌', '烦', '不喜欢', '差', '糟糕', '讨厌', '气', '愤怒'],
        response: '哼... 😤'
      },
      '猫猫嘴': {
        keywords: ['猫', '喵', '调皮', '捣蛋', '玩', '皮', '淘气', '活泼'],
        response: '喵~ 😺'
      }
    };

    // State
    let model = null;
    let app = null;
    let smartMode = true;
    let currentExpression = '';

    const statusText = document.getElementById('avatar-status');
    const loading = document.getElementById('loading');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const logContainer = document.getElementById('log-container');

    // Add log entry
    function addLog(message, type = 'normal') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    // Detect emotion from text
    function detectEmotion(text) {
      const lowerText = text.toLowerCase();
      addLog(`分析文本: "${text}"`, 'detected');

      for (const [expression, config] of Object.entries(emotionMap)) {
        for (const keyword of config.keywords) {
          if (lowerText.includes(keyword)) {
            addLog(`检测到关键词 "${keyword}" → ${expression}`, 'triggered');
            return { expression, response: config.response };
          }
        }
      }
      return null;
    }

    // Apply expression
    async function applyExpression(expr, source = 'manual') {
      if (!model) return;

      try {
        model.expression('');
        await new Promise(r => setTimeout(r, 50));
        await model.expression(expr);
        currentExpression = expr;

        statusText.textContent = source === 'smart' ? `智能识别: ${expr}` : `表情: ${expr}`;

        document.querySelectorAll('.expr-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.expr === expr);
        });

        addLog(`应用表情: ${expr} (${source})`, 'triggered');
      } catch (e) {
        console.error('表情切换失败:', e);
      }
    }

    // Add message to chat
    function addMessage(type, text, meta = null) {
      const msg = document.createElement('div');
      msg.className = `message ${type}`;

      let metaHtml = '';
      if (meta) {
        metaHtml = `<div class="message-meta">
          ${meta.emotion ? `<span class="emotion-tag">${meta.emotion}</span>` : ''}
          <span>${meta.time || new Date().toLocaleTimeString()}</span>
        </div>`;
      }

      msg.innerHTML = `
        <div class="message-avatar">${type === 'user' ? '👤' : '🤖'}</div>
        <div class="message-content">
          ${text}
          ${metaHtml}
        </div>
      `;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Send message
    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = '';
      addMessage('user', text, { time: new Date().toLocaleTimeString() });

      // Smart emotion detection
      let response = '收到你的消息啦！';
      let detectedEmotion = null;

      if (smartMode) {
        const emotion = detectEmotion(text);
        if (emotion) {
          await applyExpression(emotion.expression, 'smart');
          response = emotion.response;
          detectedEmotion = emotion.expression;
        }
      }

      // Simulate response
      setTimeout(() => {
        addMessage('system', response, {
          emotion: detectedEmotion || '默认',
          time: new Date().toLocaleTimeString()
        });
      }, 800);
    }

    // Initialize Live2D
    try {
      if (typeof Live2DCubismCore === 'undefined') {
        throw new Error('Cubism Core 未加载');
      }

      const PIXI = await import('https://esm.sh/pixi.js@6.5.10?bundle');
      console.log('✅ PixiJS 加载成功:', PIXI.VERSION);

      const { Live2DModel } = await import('https://esm.sh/pixi-live2d-display@0.4.0/cubism4?bundle&external=pixi.js');

      const canvas = document.getElementById('live2d-canvas');

      app = new PIXI.Application({
        view: canvas,
        resizeTo: canvas.parentElement,
        backgroundColor: 0x1a1a2e,
        backgroundAlpha: 1,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
        autoStart: false
      });

      model = await Live2DModel.from('yumi/yumi.model3.json', {
        autoUpdate: false
      });

      app.stage.addChild(model);

      model.anchor.set(0.5, 0.5);
      model.x = app.screen.width / 2;
      model.y = app.screen.height / 2;

      const baseScale = Math.min(
        app.screen.width / model.width,
        app.screen.height / model.height
      ) * 0.7;
      model.scale.set(baseScale);

      // Mouse tracking
      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        targetX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
        targetY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
      });

      // Animation loop
      let lastTime = performance.now();
      function animate() {
        const now = performance.now();
        const deltaMS = now - lastTime;
        lastTime = now;

        model.update(deltaMS);

        const smoothFactor = 0.1;
        currentX += (targetX - currentX) * smoothFactor;
        currentY += (targetY - currentY) * smoothFactor;

        if (model.internalModel?.coreModel) {
          const core = model.internalModel.coreModel;
          try {
            core.setParameterValueById('ParamEyeBallX', currentX);
            core.setParameterValueById('ParamEyeBallY', -currentY);
            core.setParameterValueById('ParamAngleX', currentX * 30);
            core.setParameterValueById('ParamAngleY', -currentY * 20);
          } catch (err) {}
        }

        app.renderer.render(app.stage);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      // Expression buttons
      document.querySelectorAll('.expr-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          applyExpression(btn.dataset.expr, 'manual');
        });
      });

      // Smart toggle
      document.getElementById('smart-toggle').addEventListener('click', function() {
        smartMode = !smartMode;
        this.classList.toggle('active', smartMode);
        addLog(`智能表情: ${smartMode ? '开启' : '关闭'}`);
      });

      // Quick actions
      document.getElementById('btn-reset').addEventListener('click', () => {
        model.expression('');
        currentExpression = '';
        statusText.textContent = '等待指令...';
        document.querySelectorAll('.expr-btn').forEach(b => b.classList.remove('active'));
        addLog('表情已重置');
      });

      document.getElementById('btn-random').addEventListener('click', () => {
        const exprs = Object.keys(emotionMap);
        const random = exprs[Math.floor(Math.random() * exprs.length)];
        applyExpression(random, 'random');
      });

      document.getElementById('btn-debug').addEventListener('click', () => {
        console.log('Model:', model);
        addLog('调试信息已输出到控制台');
      });

      // Chat
      document.getElementById('btn-send').addEventListener('click', sendMessage);
      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });

      loading.classList.add('hidden');
      statusText.textContent = '等待指令...';
      addLog('Agent System 初始化完成');

    } catch (error) {
      console.error('加载失败:', error);
      loading.innerHTML = `
        <div style="color: #ef4444; text-align: center;">
          <p style="font-weight: 600; margin-bottom: 8px;">❌ 加载失败</p>
          <p style="font-size: 12px;">${error.message}</p>
        </div>
      `;
    }
  </script>
</body>
</html>
