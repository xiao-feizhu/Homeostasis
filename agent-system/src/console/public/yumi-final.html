<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent System - Yumi Live2D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: 100vh;
      gap: 20px;
      padding: 20px;
    }
    .canvas-area {
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #live2d-canvas { width: 100%; height: 100%; }
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      padding: 40px;
      text-align: center;
    }
    .loading-overlay.hidden { display: none; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
    }
    .panel {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
    }
    .panel h3 {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .expression-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .expr-btn {
      padding: 10px 8px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 12px;
    }
    .expr-btn:hover, .expr-btn.active { background: #4a9eff; }
    .status-pill {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .error-box {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.5);
      padding: 20px;
      border-radius: 10px;
      font-size: 13px;
      max-width: 500px;
    }
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-area">
      <canvas id="live2d-canvas"></canvas>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">初始化中...</span>
      </div>
      <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p>正在加载 Live2D...</p>
        <p style="font-size: 12px; opacity: 0.6;">使用 esm.sh (自动处理依赖)</p>
      </div>
    </div>

    <div class="controls-panel">
      <div class="panel">
        <h3>🎭 表情控制</h3>
        <div class="expression-grid">
          <button class="expr-btn" data-expr="爱心眼">❤️ 爱心</button>
          <button class="expr-btn" data-expr="黑脸">⬛ 黑脸</button>
          <button class="expr-btn" data-expr="泪汪汪">🥺 泪汪汪</button>
          <button class="expr-btn" data-expr="猫猫嘴">😺 猫猫</button>
          <button class="expr-btn" data-expr="拿话筒">🎤 话筒</button>
          <button class="expr-btn" data-expr="星星眼">✨ 星星</button>
        </div>
        <button id="reset-expr" style="margin-top: 10px; width: 100%; padding: 8px; border: none; border-radius: 8px; background: rgba(255,255,255,0.15); color: #fff; cursor: pointer; font-size: 12px;">↩️ 重置表情</button>
      </div>

      <div class="panel">
        <h3>ℹ️ 关于</h3>
        <div style="font-size: 12px; line-height: 1.6; opacity: 0.8;">
          <p>使用 esm.sh CDN</p>
          <p>自动处理 @pixi/* 依赖</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 加载 Cubism 4 Core -->
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

  <script type="module">
    const statusText = document.getElementById('status-text');
    const loading = document.getElementById('loading');

    try {
      // 检查 Cubism Core
      if (typeof Live2DCubismCore === 'undefined') {
        throw new Error('Cubism Core 未加载');
      }

      // 使用 PixiJS 6.x 版本（与 pixi-live2d-display 0.4.0 兼容）
      const PIXI = await import('https://esm.sh/pixi.js@6.5.10?bundle');
      console.log('✅ PixiJS 加载成功:', PIXI.VERSION);

      // 使用 cubism4 专用入口
      const { Live2DModel } = await import('https://esm.sh/pixi-live2d-display@0.4.0/cubism4?bundle&external=pixi.js');
      console.log('✅ Live2D 加载成功');

      const canvas = document.getElementById('live2d-canvas');

      // 创建 PixiJS 应用
      console.log('创建 PixiJS 应用...');
      const app = new PIXI.Application({
        view: canvas,
        resizeTo: canvas.parentElement,
        backgroundColor: 0x222222,
        backgroundAlpha: 1,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
        autoStart: false
      });
      console.log('✅ PixiJS 应用创建成功');

      // 加载模型 (使用 autoUpdate: false 手动控制更新)
      console.log('开始加载模型...');
      const model = await Live2DModel.from('yumi/yumi.model3.json', {
        autoUpdate: false
      });
      console.log('✅ 模型加载成功:', model);

      app.stage.addChild(model);
      console.log('✅ 模型已添加到舞台');

      // 居中显示
      model.anchor.set(0.5, 0.5);
      model.x = app.screen.width / 2;
      model.y = app.screen.height / 2;

      const scale = Math.min(
        app.screen.width / model.width,
        app.screen.height / model.height
      ) * 0.7;
      model.scale.set(scale);

      // 鼠标跟踪 - 平滑插值让头部自然跟随
      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        targetX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
        targetY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
      });

      // 使用 requestAnimationFrame 更新循环
      let lastTime = performance.now();
      function animate() {
        const now = performance.now();
        const deltaMS = now - lastTime;
        lastTime = now;

        // 更新模型
        model.update(deltaMS);

        // 线性插值 (Lerp) 使运动更自然
        const smoothFactor = 0.1;
        currentX += (targetX - currentX) * smoothFactor;
        currentY += (targetY - currentY) * smoothFactor;

        const x = currentX;
        const y = currentY;

        // 使用 model.focus 控制视线
        if (model.focus) {
          model.focus(x, -y);
        }

        // 直接设置参数
        if (model.internalModel && model.internalModel.coreModel) {
          const core = model.internalModel.coreModel;
          try {
            core.setParameterValueById('ParamEyeBallX', x);
            core.setParameterValueById('ParamEyeBallY', -y);
            core.setParameterValueById('ParamAngleX', x * 30);
            core.setParameterValueById('ParamAngleY', -y * 20);
            core.setParameterValueById('ParamAngleZ', x * 10);
            core.setParameterValueById('ParamBodyAngleX', x * 15);
            core.setParameterValueById('ParamNeckAngleX', x * 20);
            core.setParameterValueById('ParamNeckAngleY', -y * 15);
          } catch (err) {}
        }

        // 渲染舞台
        app.renderer.render(app.stage);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
      console.log('✅ 更新循环已启动');

      // 表情按钮
      document.querySelectorAll('.expr-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const expr = btn.dataset.expr;
          try {
            console.log('尝试切换表情:', expr);
            // 先重置再应用新表情
            model.expression('');
            await new Promise(r => setTimeout(r, 50));
            await model.expression(expr);
            statusText.textContent = '表情: ' + expr;
            document.querySelectorAll('.expr-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            console.log('表情切换成功:', expr);
          } catch (e) {
            console.error('表情切换失败:', e);
            statusText.textContent = '表情切换失败: ' + e.message;
          }
        });
      });

      // 重置表情按钮
      document.getElementById('reset-expr').addEventListener('click', () => {
        model.expression('');
        statusText.textContent = 'Yumi 已就绪';
        document.querySelectorAll('.expr-btn').forEach(b => b.classList.remove('active'));
        console.log('表情已重置');
      });

      // 完成
      console.log('✅ 所有初始化完成');
      loading.classList.add('hidden');
      statusText.textContent = 'Yumi 已就绪';

    } catch (error) {
      console.error('加载失败:', error);
      loading.innerHTML = `
        <div class="error-box">
          <p><strong>❌ 加载失败</strong></p>
          <p style="margin-top: 8px;">${error.message}</p>
          <p style="margin-top: 12px; font-size: 11px; opacity: 0.8;">
            详细错误请查看控制台 (F12)
          </p>
        </div>
        <button onclick="location.reload()" style="margin-top: 15px; padding: 10px 20px; border: none; border-radius: 8px; background: #4a9eff; color: white; cursor: pointer;">
          重新加载
        </button>
      `;
      statusText.textContent = '加载失败';
    }
  </script>
</body>
</html>
